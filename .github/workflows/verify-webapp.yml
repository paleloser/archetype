name: Web App PR Verification

# Draft pull requests do not run CI — see verify-server.yml for the rationale.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
      - main
    paths:
      - 'webapp/**'
      # The webapp generates its API client from this spec at install time, so
      # a change here can break its build without touching webapp/ at all.
      - 'server/backend/src/main/resources/api/v1.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ./webapp
jobs:
  build:
    name: Build
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Installs NodeJs
        uses: actions/setup-node@v6
        with:
          node-version-file: 'webapp/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'webapp/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run build
        run: npm run build
