openapi: 3.0.3
info:
  title: acme server
  description: >-
    Contract-first REST API. The server generates its controllers and DTOs from this file, and the webapp generates its
    client from it, so a change here is a change on both sides.
  contact:
    email: hello@acme.example
  version: 0.1.0
servers:
  - description: Local development environment instance
    url: http://localhost:{port}/v1
    variables:
      port:
        enum:
          - '8080'
        default: '8080'
  - description: Production instance
    url: https://api.acme.example/v1
    variables:
      port:
        enum:
          - '443'
        default: '443'
tags:
  - name: notes
    description: Everything related to Notes. A sample resource showing every layer of the archetype; replace it.
security:
  - oAuth2AuthCode: [ openid ]
paths:
  /notes:
    get:
      tags:
        - notes
      summary: Lists Notes, newest first
      operationId: findNotes
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotesPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - notes
      summary: Creates a Note
      operationId: createNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteRequest'
      responses:
        '201':
          description: The created Note
          headers:
            Location:
              description: URL of the created Note
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /notes/{noteId}:
    get:
      tags:
        - notes
      summary: Gets a Note
      operationId: findNote
      parameters:
        - $ref: '#/components/parameters/NoteId'
      responses:
        '200':
          description: The Note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - notes
      summary: Updates a Note
      operationId: updateNote
      parameters:
        - $ref: '#/components/parameters/NoteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteRequest'
      responses:
        '200':
          description: The updated Note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - notes
      summary: Deletes a Note
      operationId: deleteNote
      parameters:
        - $ref: '#/components/parameters/NoteId'
      responses:
        '204':
          description: The Note was deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  parameters:
    NoteId:
      name: noteId
      in: path
      description: Unique identifier of a Note
      required: true
      schema:
        type: string
        format: uuid
      example: 'b07acbea-c1b1-46c2-aed5-3ad53abb28b0'
    PageNumber:
      name: pageNumber
      in: query
      description: Page number, starting at 0
      schema:
        type: integer
        minimum: 0
        default: 0
    PageSize:
      name: pageSize
      in: query
      description: Page size
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Bad request. Some fields of the request are not valid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ConstraintsViolationsError'
    Unauthorized:
      description: Unauthorized. This endpoint requires authentication.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal server error. Try again later.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ConstraintsViolation:
      type: object
      description: It represents a violation of a constraint.
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: The field that is causing the constraints violation.
          example: title
        message:
          type: string
          description: The human-readable constraints violation description.
          example: Must not be empty
      example:
        field: title
        message: Must not be empty
    ConstraintsViolationsError:
      type: object
      description: Error object extension for returning a constraints violation error.
      required:
        - violations
      properties:
        violations:
          type: array
          items:
            $ref: '#/components/schemas/ConstraintsViolation'
          example:
            - field: title
              message: Must not be empty
      allOf:
        - $ref: '#/components/schemas/Error'
      example:
        type: https://api.acme.example/errors/ARGUMENT_NOT_VALID
        title: Validation error
        status: 400
        detail: Some fields of the request are not valid
        violations:
          - field: title
            message: Must not be empty
    Error:
      type: object
      description: >-
        Error object returned on any failure. It follows the [RFC-9457](https://datatracker.ietf.org/doc/html/rfc9457)
        standard.
      required:
        - type
        - title
      properties:
        type:
          type: string
          format: uri
          description: >-
            A URI reference that identifies the problem type. If the URI is a locator, dereferencing it SHOULD
            provide human-readable documentation for the problem type.
          example: https://api.acme.example/errors/NOT_FOUND
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          example: Not Found
        status:
          type: integer
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          example: 404
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Note does not exist!
        instance:
          type: string
          format: uri
          description: >-
            A URI reference that identifies the specific occurrence of the problem. When the "instance" URI is
            dereferenceable, the problem details object can be fetched from it. When the "instance" URI is not
            dereferenceable, it serves as a unique identifier for the problem occurrence.
          example: https://api.acme.example/notes/12345
      example:
        type: https://api.acme.example/errors/NOT_FOUND
        title: Not Found
        status: 404
        detail: Note does not exist!
    Note:
      type: object
      description: A sample resource. Replace it with the first aggregate of your domain.
      required:
        - id
        - title
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          example: 'b07acbea-c1b1-46c2-aed5-3ad53abb28b0'
        title:
          type: string
          example: Groceries
        content:
          type: string
          example: Milk, eggs and bread
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NoteRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Groceries
        content:
          type: string
          maxLength: 10000
          example: Milk, eggs and bread
    Page:
      type: object
      required:
        - number
        - totalItems
        - totalPages
      properties:
        number:
          type: integer
          format: int32
          description: Number of page
        totalItems:
          type: integer
          format: int64
          description: Total number of entities
        totalPages:
          type: integer
          description: Total number of pages
    NotesPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Note'
  securitySchemes:
    oAuth2AuthCode:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.acme.example/authorize
          tokenUrl: https://auth.acme.example/oauth/token
          scopes:
            openid: General API usage
